name: llamacpp

networks:
  ai-backend:
    external: true

services:
  #===============================  llama.cpp  ===============================#
  # WHAT: Llama.cpp as an openai API compatible local model inference backend
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    #command: >
    #  --temp 0.75
    #  --top-p 0.95
    #  --top-k 20

    # gemma-4 settings
    command: >
      --temp 1.0
      --top-p 0.95
      --top-k 64

    #command: >
    #  --temp 0.4
    #  --top-p 0.9
    #  --top-k 27

    # qwen3.8
    #command: >
    #  --temp 1.0
    #  --top-p 0.95
    #  --top-k 20

    environment:
      # REQUIRED: replace with the EXACT filename you want to serve


      # GEMMAS
      # ======
      #LLAMA_ARG_MODEL: /models/gemma-4/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
      #LLAMA_ARG_MODEL: /models/gemma-4/gemma-4-31B-it-UD-Q5_K_XL.gguf
      #LLAMA_ARG_MODEL: /models/gemma-4/gemma-4-31B-it-UD-Q4_K_XL.gguf
      #LLAMA_ARG_MODEL: /models/gemma-4/gemma-4-12b-it-UD-Q8_K_XL.gguf

      #--------------------------  GEMMA-4-26B-A4B  --------------------------#
      LLAMA_ARG_MODEL: /models/gemma-4/gemma-4-26B-A4B-it-MXFP4_MOE.gguf
      LLAMA_ARG_CHAT_TEMPLATE_FILE: /models/gemma-4/chat_template-26B-A4B-it.jinja
      #LLAMA_ARG_MMPROJ: /models/gemma-4/gemma-4-26B-A4B-mmproj-BF16.gguf
      LLAMA_ARG_SPEC_DRAFT_MODEL: /models/gemma-4/mtp-gemma-4-26B-A4B-it.gguf
      LLAMA_ARG_SPEC_TYPE: draft-mtp        # --spec-type draft-mtp
      LLAMA_ARG_SPEC_DRAFT_N_MAX: 2         # --spec-draft-n-max 2 (adjust 2–3 if you want)


      #----------------------------  GEMMA-4-31B  ----------------------------#

      #LLAMA_ARG_MODEL: /models/gemma-4/Gemma4-31B-QAT-Uncensored-HauhauCS-Balanced-Q4_K_M.gguf
      #LLAMA_ARG_CHAT_TEMPLATE_FILE: /models/gemma-4/gemma-4-31B-it-uncensored-heretic-chat_template.jinja
      #LLAMA_ARG_MODEL: /models/gemma-4/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
      #LLAMA_ARG_MMPROJ: /models/gemma-4/gemma-4-31B-it-MTP_mmproj-BF16.gguf
      #LLAMA_ARG_SPEC_DRAFT_MODEL: /models/gemma-4/mtp-gemma-4-31B-it-Q8_0.gguf
      #LLAMA_ARG_CHAT_TEMPLATE_FILE: /models/gemma-4/chat_template-31B-it.jinja
      #LLAMA_ARG_SPEC_TYPE: draft-mtp        # --spec-type draft-mtp
      #LLAMA_ARG_SPEC_DRAFT_N_MAX: 2         # --spec-draft-n-max 2 (adjust 2–3 if you want)




      #LLAMA_ARG_MODEL: /models/gemma-4/gemma-4-31B-it-uncensored-heretic-Q6_K.gguf
      #LLAMA_ARG_CHAT_TEMPLATE_FILE: /models/gemma-4/gemma-4-31B-it-uncensored-heretic-chat_template.jinja

      #LLAMA_ARG_MODEL: /models/gemma-4/gemma-4-31B-it-UD-Q4_K_XL.gguf

      #LLAMA_ARG_MODEL: /models/gemma-4/gemma-4-31B-it-Q6_K.gguf
      #LLAMA_ARG_MODEL: /models/gemma-4/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
      #LLAMA_ARG_SPEC_DRAFT_MODEL: /models/gemma-4/mtp-gemma-4-31B-it-Q8_0.gguf
      #LLAMA_ARG_MMPROJ: /models/gemma-4/gemma-4-31B-it-MTP_mmproj-BF16.gguf
      #LLAMA_ARG_CHAT_TEMPLATE_FILE: /models/gemma-4/chat_template-31B-it.jinja
      #LLAMA_ARG_SPEC_TYPE: draft-mtp        # --spec-type draft-mtp
      #LLAMA_ARG_SPEC_DRAFT_N_MAX: 2         # --spec-draft-n-max 2 (adjust 2–3 if you want)


      #LLAMA_ARG_MODEL: /models/gemma-4/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      #LLAMA_ARG_SPEC_DRAFT_MODEL: /models/gemma-4/mtp-gemma-4-12B-it.gguf
      #LLAMA_ARG_MMPROJ: /models/gemma-4/mmproj-gemma-4-12B-it-QAT-BF16.gguf
      #LLAMA_ARG_CHAT_TEMPLATE_FILE: /models/gemma-4/chat_template.jinja
      #LLAMA_ARG_SPEC_TYPE: draft-mtp        # --spec-type draft-mtp
      #LLAMA_ARG_SPEC_DRAFT_N_MAX: 2         # --spec-draft-n-max 2 (adjust 2–3 if you want)


      #LLAMA_ARG_MODEL: /models/gemma-4/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf #gemma-4-31B-it-UD-Q5_K_XL.gguf
      #LLAMA_ARG_MODEL: /models/gemma-4/gemma-4-31B-it-Q6_K.gguf
      #LLAMA_ARG_MODEL: /models/gemma-4/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
      #LLAMA_ARG_SPEC_DRAFT_MODEL: /models/gemma-4/gemma-4-31B-it-Q8_0-MTP.gguf

      # GEMMA-12
      #=========
      # yuxinlu1/gemma-4-12B-agentic-fable5-composer2.5-v2-3.5x-tau2-GGUF
      #LLAMA_ARG_MODEL: /models/gemma-4/gemma4-v2-Q8_0.gguf
      #LLAMA_ARG_SPEC_DRAFT_MODEL: /models/gemma-4/gemma-4-12B-it-MTP-BF16.gguf


      #LLAMA_ARG_MODEL: /models/gemma-4/gemma-4-31B-it-uncensored-heretic-Q8_0.gguf
      #LLAMA_ARG_CHAT_TEMPLATE_FILE: /models/gemma-4/gemma-4-31B-it-uncensored-heretic-chat_template.jinja
      #LLAMA_ARG_CHAT_TEMPLATE_FILE: /models/gemma-4/chat_template-31B-it.jinja
      #LLAMA_ARG_CHAT_TEMPLATE_FILE: /models/gemma-4/gemma-4-12B-it_chat_template.jinja
      #LLAMA_ARG_CHAT_TEMPLATE_FILE: /models/gemma-4/chat_template-26B-A4B-it.jinja
      #LLAMA_ARG_MMPROJ: /models/gemma-4/gemma-4-31B_mmproj-BF16.gguf
      #LLAMA_ARG_MMPROJ: /models/gemma-4/gemma-4-26B-A4B-mmproj-BF16.gguf

      # Current llama.cpp env name for --model-draft / --spec-draft-model:
      #LLAMA_ARG_SPEC_DRAFT_MODEL: /models/gemma-4/mtp-gemma-4-31B-it.gguf
      #LLAMA_ARG_SPEC_DRAFT_MODEL: /models/gemma-4/mtp-gemma-4-26B-A4B-it.gguf



      # Usually good for Gemma 4 / MTP.
      LLAMA_ARG_FLASH_ATTN: on
      #LLAMA_ARG_FIT: off

      #LLAMA_ARG_CTX_SIZE: 131072
      #LLAMA_ARG_CTX_SIZE: 222222
      LLAMA_ARG_CTX_SIZE: 65536
      #LLAMA_ARG_CTX_SIZE: 32768


      # QWENS
      # =====
      #----  "UNCENSORED"
      #LLAMA_ARG_MODEL: /models/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf
      #LLAMA_ARG_MMPROJ: /models/mmproj-Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-f16.gguf
      #LLAMA_ARG_MODEL: /models/Qwen3.6-27B-Uncensored-HauhauCS-Aggressive-Q6_K_P.gguf
      #LLAMA_ARG_MODEL: /models/Qwen3.6-27B-Uncensored-HauhauCS-Aggressive-Q4_K_P.gguf
      #LLAMA_ARG_MMPROJ: /models/mmproj-Qwen3.6-27B-Uncensored-HauhauCS-Aggressive-f16.gguf

      # GENERAL CHAT TEMPLATE
      #LLAMA_ARG_CHAT_TEMPLATE_FILE: /models/qwen3.6_chat_template.jinja
      #LLAMA_ARG_CHAT_TEMPLATE_FILE: /models/chat_template.jinja

      # 27B
      #LLAMA_ARG_MODEL: /models/Qwen3.6-27B-Q6_K.MTP.gguf
      #LLAMA_ARG_MODEL: /models/Qwen3.6-27B-Q5_K_S.MTP.gguf
      #LLAMA_ARG_MMPROJ: /models/mmproj-Qwen3.6-27B-Q6_K.MTP.gguf


      #LLAMA_ARG_MODEL: /models/Qwen3.6-27B-IQ4_NL.MTP.gguf

      #LLAMA_ARG_MODEL: /models/Qwen3.6-35B-A3B-MXFP4_MOE.MTP.gguf
      #LLAMA_ARG_SPEC_TYPE: draft-mtp        # --spec-type draft-mtp
      #LLAMA_ARG_SPEC_DRAFT_N_MAX: 6         # --spec-draft-n-max 2 (adjust 2–3 if you want)



      #LLAMA_ARG_MODEL: /models/Qwen3.5-4B-Q8_0.MTP.gguf
      #LLAMA_ARG_SPEC_TYPE: draft-mtp        # --spec-type draft-mtp
      #LLAMA_ARG_SPEC_DRAFT_N_MAX: 6         # --spec-draft-n-max 2 (adjust 2–3 if you want)

      # 35B-A3B
      #LLAMA_ARG_MODEL: /models/Qwen3.6-35B-A3B-MXFP4_MOE.MTP.gguf
      #LLAMA_ARG_MMPROJ: /models/mmproj-Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-f16.gguf


      # QWEN3.8
      #LLAMA_ARG_MODEL: /models/Qwen3.8-27B-UD-Q5_K_S.gguf
      #LLAMA_ARG_SPEC_DRAFT_MODEL: /models/mtp-Qwen3.8-27B-Q4_0.gguf
      ##LLAMA_ARG_MMPROJ: /models/mmproj-BF16-Qwen3.8-27B.gguf
      #LLAMA_ARG_CHAT_TEMPLATE_FILE: /models/chat-template-Qwen3.8-27B.jinja
      #LLAMA_ARG_SPEC_TYPE: draft-mtp        # --spec-type draft-mtp
      #LLAMA_ARG_SPEC_DRAFT_N_MAX: 2         # --spec-draft-n-max 2 (adjust 2–3 if you want)




      #====  OTHERS
      #LLAMA_ARG_MODEL: /models/GPT-OSS-20B-Uncensored-HauhauCS-MXFP4-Balanced.gguf
      #LLAMA_ARG_MODEL: /models/NVIDIA-Nemotron-3-Nano-Omni-30B-A3B-Reasoning-UD-IQ4_NL_XL.gguf
      #LLAMA_ARG_MODEL: /models/GLM-4.7-Flash-Q5_K_M.gguf

      # MTP speculative decoding
      #LLAMA_ARG_SPEC_TYPE: draft-mtp        # --spec-type draft-mtp
      #LLAMA_ARG_SPEC_DRAFT_N_MAX: 4         # --spec-draft-n-max 2 (adjust 2–3 if you want)


      LLAMA_ARG_ALIAS: swol-doge

      #LLAMA_API_KEY: ayyylmao  # just some bullshit dummy key

      LLAMA_ARG_JINJA: true

      # server bind / API shit
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080

      LLAMA_ARG_N_PARALLEL: 1
      LLAMA_ARG_N_GPU_LAYERS: auto  # --n-gpu-layers



      # NUMBER OF GPU DEVICES TO USE
      # ============================
      # `--split-mode`
      # how to split model across multuiple gpus, opts:
      #     none :  use one gpu only
      #     layer : (DEFAULT) split layers and KV across gpus
      #     row :   split rows across GPus
      #LLAMA_ARG_SPLIT_MODE: none  # --split-mode
      LLAMA_ARG_SPLIT_MODE: layer  # --split-mode

      # which gpu ID to select (when split mode is none and multiple gpu avail)
      # i have dual gpu ('cuda:0', 'cuda:1'), so i set to the second for
      # single-gpu use
      LLAMA_ARG_MAIN_GPU: 0  # --main-gpu
      #LLAMA_ARG_MAIN_GPU: 1  # --main-gpu

      # optional metrics endpoint
      LLAMA_ARG_ENDPOINT_METRICS: 1

    volumes:
      # bind directly to usert space GGUF models dir (read-only)
      - /home/evan/Models/GGUFZ:/models:ro

    ipc: host
    ports:
      - "127.0.0.1:8080:8080"

    healthcheck:
      disable: true

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1']
              capabilities: [gpu]

    networks:
      - ai-backend

    restart: unless-stopped
