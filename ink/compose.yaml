name: llamacpp

# ACCESS:
#   INTERNAL (docker): http://llama-cpp:8080/v1
#   HOST: http://127.0.0.1:8080/v1
#   REMOTE: https://mytailnet.tail3cf3cf.ts.net/v1
#     serve: tailscale serve --bg --https=443 --set-path=/v1 http://127.0.0.1:8080/v1
#
# TEST:
#   curl -s http://127.0.0.1:8080/v1/chat/completions \
#   -H 'Content-Type: application/json' -d \
#   '{"model": "swol-doge", "messages": [{"role":"user","content":"sup dawg"}]}' \
#   | jq .

networks:
  ai-backend:
    external: true

services:
  llama-cpp:
    #container_name: llamacpp
    #image: ghcr.io/ggml-org/llama.cpp:server-cuda
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b12648
    #image: ghcr.io/ggml-org/llama.cpp:server-cuda-inkling

    #image: local/llama.cpp:server-cuda-inkling
    # -------------------------------------------------------------------------
    #=== REASONING MODE
    command: >
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
    # -------------------------------------------------------------------------
    environment:
      #LLAMA_ARG_MMPROJ: /models/mmproj-Inkling-2-Mini-BF16.gguf

      #LLAMA_ARG_MODEL: /models/Inkling-2-Mini-UD-Q2_K_XL.gguf  # can ctx 262k
      LLAMA_ARG_MODEL: /models/Inkling-2-Mini-UD-Q3_K_XL.gguf  # ctx lim to 131

      #LLAMA_ARG_SPEC_DRAFT_MODEL: /models/dspark-Inkling-2-Mini-Q8_0.gguf
      #LLAMA_ARG_SPEC_TYPE: draft-dspark
      #LLAMA_ARG_SPEC_DRAFT_N_MAX: 3

      LLAMA_ARG_CACHE_TYPE_K: q4_0
      LLAMA_ARG_CACHE_TYPE_V: q4_0

      #LLAMA_ARG_REASONING_EFFORT: medium

      #LLAMA_ARG_CTX_SIZE: 262144  # Q2
      LLAMA_ARG_CTX_SIZE: 131072  # Q3

      LLAMA_ARG_FLASH_ATTN: on

      # SERVER CONFIG
      # =============
      LLAMA_ARG_ALIAS: swol-doge
      #LLAMA_API_KEY: ayyylmao  # just some bullshit dummy key
      LLAMA_ARG_JINJA: true

      # server bind / API shit
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080

      # optional metrics endpoint
      LLAMA_ARG_ENDPOINT_METRICS: 1

      # DEVICE SETTINGS
      # ===============
      LLAMA_ARG_N_PARALLEL: 1 #2
      LLAMA_ARG_N_GPU_LAYERS: auto #all  # --n-gpu-layers

      #===  NUMBER OF GPU DEVICES TO USE
      # `--split-mode`
      # how to split model across multuiple gpus, opts:
      #     none :  use one gpu only
      #     layer : (DEFAULT) split layers and KV across gpus
      #     row :   split rows across GPus
      #LLAMA_ARG_SPLIT_MODE: none  # --split-mode
      LLAMA_ARG_SPLIT_MODE: layer  # --split-mode

      #===  GPU device (by ID) to use when single-gpu (i.e. --split-mode none)
      LLAMA_ARG_MAIN_GPU: 0  # --main-gpu

    # -------------------------------------------------------------------------
    volumes:
      # bind directly to usert space GGUF models dir (read-only)
      - $HOME/Models/GGUFZ:/models:ro

    ipc: host
    ports:
      - "127.0.0.1:8080:8080"

    networks:
      - ai-backend

    restart: unless-stopped

    healthcheck:
      disable: true
    # -------------------------------------------------------------------------
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1']
              capabilities: [gpu]

