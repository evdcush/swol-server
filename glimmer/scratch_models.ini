version = 1

; The section name is the stable OpenAI model ID used by LiteLLM and Muse.
;;;  MODEL
; section_name: openai/{section_name} in llama.cpp and litellm
[swol-doge-glimmer]
model = /models/Muse-Glimmer-30B-KQuant-Dynamic-Q4_K_XL.gguf
chat-template-file = /models/chat-template.muse-glimmer-30b.jinja

;-----------------------------------------------------------------------------;

;;;  SAMPLING
temp = 1.0
top-p = 0.95
top-k = 64

;-----------------------------------------------------------------------------;

;;;  CTX
;ctx-size = 65536
ctx-size = 131072
n-predict = 32768
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn = on
fit = true

;-----------------------------------------------------------------------------;

;;;  SPEC
;spec-type = draft-dflash
;spec-draft-n-max = 5
;spec-draft-type-k = q8_0
;spec-draft-type-v = q8_0

;-----------------------------------------------------------------------------;

;;;  REASONING
reasoning = on
; Supported reasoning levels:
;   - low
;   - medium
;   - high
;   - xhigh
reasoning-effort = xhigh
reasoning-preserve = true

;-----------------------------------------------------------------------------;

;;;  MISC
jinja = true
cache-prompt = true
parallel = 1
n-gpu-layers = auto
; split-mode 'layer': multi-gpu
;   - layer: multi-gpu
;   - none:  single-gpu
split-mode = layer
main-gpu = 0
;tensor-split = 1,1
;cache-reuse = 256

