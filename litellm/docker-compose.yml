name: litellm

# Start:
#   docker compose up -d --build
#
# Docker apps:  OPENAI_API_BASE_URL=http://litellm:4000/v1
#   Host apps:  OPENAI_API_BASE_URL=http://127.0.0.1:4000/v1
#
# Tailscale:
#   tailscale serve --bg --https=443 --set-path=/v1 http://127.0.0.1:4000/v1
#   OPENAI_API_BASE_URL=https://mytailnet.ts.net/v1
#
# Native local groups:
#     swol-doge:       instruct-tuned chat model (generally + vision)
#     swol-doge-embed: text embedding model (generally 768-dim)
#     whisper-1:       whisper.cpp v3-large-turbo
#     muse-local:      task-specialized swol-doge

networks:
  ai-backend:
    external: true

services:
  litellm:
    build: .
    container_name: litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    configs:
      - source: litellm-config
        target: /app/config.yaml
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - ai-backend
    #healthcheck:
    #  test:
    #    - CMD-SHELL
    #    - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"
    #  interval: 30s
    #  timeout: 10s
    #  retries: 3
    #  start_period: 30s
    healthcheck:
      disable: true
    environment:
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY}
      LITELLM_OTEL_V2: "true"

      OTEL_EXPORTER: otlp_http
      OTEL_ENDPOINT: http://mlflow:5000/v1/traces
      OTEL_HEADERS: x-mlflow-experiment-id=${MLFLOW_EXPERIMENT_ID_LITELLM}
      OTEL_SERVICE_NAME: litellm

      # Put GenAI input/output on the root request span so MLflow's
      # trace table populates its Input and Output columns.
      USE_OTEL_LITELLM_REQUEST_SPAN: "false"

      # Store message content once, as span attributes.
      # Avoid SPAN_AND_EVENT, which emits the same content in both forms.
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: SPAN_ONLY

      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none

configs:
  litellm-config:
    content: |
      model_list:
        # Muse's explicit local target. Capabilities are declared because this
        # custom OpenAI-compatible model is not in LiteLLM's hosted model map.
        - model_name: muse-local
          litellm_params:
            model: openai/swol-doge
            api_base: http://llama-cpp:8080/v1
            api_key: ${LLAMA_CPP_API_KEY:-ayyylmao}
            timeout: 600
          model_info:
            mode: chat
            max_input_tokens: 65536
            max_output_tokens: 16384
            input_cost_per_token: 0
            output_cost_per_token: 0
            supports_system_messages: true
            supports_function_calling: true
            supports_tool_choice: true
            supports_parallel_function_calling: false
            supports_response_schema: true
            supports_reasoning: true
            supported_openai_params:
              - messages
              - temperature
              - top_p
              - max_tokens
              - max_completion_tokens
              - tools
              - tool_choice
              - parallel_tool_calls
              - response_format
              - reasoning_effort

        - model_name: swol-doge
          litellm_params:
            model: openai/swol-doge
            api_base: http://llama-cpp:8080/v1
            api_key: ${LLAMA_CPP_API_KEY:-ayyylmao}
            timeout: 600
          model_info:
            mode: chat
            #input_cost_per_token: 0
            #output_cost_per_token: 0
            supports_system_messages: true
            supports_function_calling: true
            supports_tool_choice: true
            supports_parallel_function_calling: false
            supports_response_schema: true
            supports_reasoning: true

        - model_name: swol-doge-embed
          litellm_params:
            model: openai/swol-doge
            api_base: http://llama-cpp-embed:8081/v1
            api_key: none
          model_info:
            mode: embedding

        - model_name: whisper-1
          litellm_params:
            model: openai/whisper-1
            api_base: http://llama-cpp-speech:8195/v1
            api_key: none
          model_info:
            mode: audio_transcription

        #----------------------------  NVIDIA NIM  ---------------------------#
        - model_name: nim-glm-5.3
          litellm_params:
            model: nvidia_nim/z-ai/glm-5.3
            api_key: os.environ/NVIDIA_NIM_API_KEY
          model_info:
            mode: chat
            max_input_tokens: 1048576
            supports_vision: false
            supports_reasoning: true
            supports_function_calling: true
            reasoning_effort_levels:
              - low
              - high
              - max
            metadata:
              parameters_total: 753B
              parameters_active: ~40B
              input_modalities: [text]
              thinking_disableable: false
              reasoning_default: max

        - model_name: nim-glm-5.3-flash
          litellm_params:
            model: nvidia_nim/z-ai/glm-5.3-flash
            api_key: os.environ/NVIDIA_NIM_API_KEY
          model_info:
            mode: chat
            max_input_tokens: 1048576
            supports_vision: true
            supports_reasoning: true
            supports_function_calling: true
            reasoning_effort_levels:
              - low
              - high
              - max
            metadata:
              parameters_total: 320B
              parameters_active: 18B
              input_modalities: [text, image]
              max_images_per_request: 8
              thinking_disableable: false
              reasoning_default: max

        - model_name: nim-kimi-k3
          litellm_params:
            model: nvidia_nim/moonshotai/kimi-k3
            api_key: os.environ/NVIDIA_NIM_API_KEY
          model_info:
            mode: chat
            max_input_tokens: 1048576
            supports_vision: true
            supports_reasoning: true
            supports_function_calling: true
            supports_response_schema: true
            reasoning_effort_levels:
              - low
              - high
              - max
            metadata:
              parameters_total: 2.8T
              parameters_active: 104B
              input_modalities: [text, image]
              thinking_disableable: false
              reasoning_default: max
              preserve_reasoning_history: true

        - model_name: nim-nemotron-ultra
          litellm_params:
            model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
            api_key: os.environ/NVIDIA_NIM_API_KEY
          model_info:
            mode: chat
            max_input_tokens: 1048576
            supports_vision: false
            supports_reasoning: true
            supports_function_calling: true
            metadata:
              parameters_total: 550B
              parameters_active: 55B
              input_modalities: [text]
              thinking_disableable: true
              reasoning_modes: [off, medium, full]
              reasoning_default: full

        - model_name: nim-nemotron-super
          litellm_params:
            model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
            api_key: os.environ/NVIDIA_NIM_API_KEY
          model_info:
            mode: chat
            max_input_tokens: 1048576
            supports_vision: false
            supports_reasoning: true
            supports_function_calling: true
            metadata:
              parameters_total: 120B
              parameters_active: 12B
              input_modalities: [text]
              thinking_disableable: true
              reasoning_modes: [off, low, full]
              reasoning_default: full

        - model_name: nim-laguna-xs-2.1
          litellm_params:
            model: nvidia_nim/poolside/laguna-xs-2.1
            api_key: os.environ/NVIDIA_NIM_API_KEY
          model_info:
            mode: chat
            max_input_tokens: 262144
            supports_vision: false
            supports_reasoning: true
            supports_function_calling: true
            metadata:
              parameters_total: 33B
              parameters_active: 3B
              input_modalities: [text]
              thinking_disableable: true
              reasoning_modes: [off, on]

        - model_name: nim-deepseek-v4.1-flash
          litellm_params:
            model: nvidia_nim/deepseek-ai/deepseek-v4.1-flash
            api_key: os.environ/NVIDIA_NIM_API_KEY
          model_info:
            mode: chat
            max_input_tokens: 1048576
            supports_vision: true
            supports_reasoning: true
            supports_function_calling: true
            supports_response_schema: true
            metadata:
              parameters_total: 552B
              parameters_active_prefill: 8B
              parameters_active_decode: 16B
              input_modalities: [text, image]
              thinking_disableable: false
              reasoning_effort_range: 1-100
              reasoning_default: 100

      litellm_settings:
        drop_params: true
        callbacks:
          - pdf_text_hook.handler

      router_settings:
        num_retries: 0
        model_group_alias:
          # Drop-in compatibility for Muse's previous paid model targets.
          gpt-5.6-sol: muse-local
          gpt-5.6-sol-high: muse-local
          gpt-5.6-luna: muse-local

          # common served model -> local chat model group
          gpt-5.5: swol-doge
          gpt-5.5-pro: swol-doge
          gpt-5.4: swol-doge
          gpt-5.4-mini: swol-doge
          gpt-5.4-nano: swol-doge
          claude-opus-4.8: swol-doge
          claude-sonnet-4.6: swol-doge
          claude-haiku-4.5: swol-doge
          glm-5.2: swol-doge
          glm-5.1: swol-doge
          gemma-4-31b: swol-doge
          gemma-4-26b: swol-doge
          qwen3.6-plus: swol-doge
          deepseek-v4-pro: swol-doge
          deepseek-v4-flash: swol-doge
          mistral-large: swol-doge
          mistral-medium-3.5: swol-doge
          kimi-k2.6: swol-doge
          minimax-m2.7: swol-doge

          text-embedding-3-small: swol-doge-embed
